defaults:
  - view_sampler: arbitrary

name: custom_images
roots: [datasets/custom_images]

image_shape: [480, 640]
background_color: [0.0, 0.0, 0.0]
cameras_are_circular: false

# Set this to select a specific scene (e.g., "realm_1" or "realm_2")
# Leave as null to use all scenes
scene_selection: realm_1

overfit_to_scene: null

# Name of the per-scene metadata JSON file to load.
# Example scene layout:
#   datasets/custom_images/test/scene_001/
#     000.png
#     001.png
#     cameras.json
# Expected cameras.json format:
# {
#   "scene": "scene_001",
#   "frames": [
#     {
#       "image": "000.png",
#       "intrinsics": [[fx, 0, cx], [0, fy, cy], [0, 0, 1]],
#       "extrinsics": [[r11, r12, r13, tx], [r21, r22, r23, ty], [r31, r32, r33, tz], [0, 0, 0, 1]]
#     }
#   ]
# }
# intrinsics_are_normalized=false means fx, fy, cx, cy are in pixel units.
# extrinsics_are_c2w=true means extrinsics are OpenCV-style camera-to-world (C2W).
# All poses in the dataloader batches are C2W; if extrinsics_are_c2w=false, the
# loader inverts them (W2C -> C2W) before adding them to the batch.
metadata_file: cameras.json
intrinsics_are_normalized: false
extrinsics_are_c2w: true

augment: false
train_times_per_scene: 1
test_times_per_scene: 1
test_chunk_interval: 1
shuffle_val: false
skip_bad_shape: true

# Depth range (metres) for the cost volume and volume rendering near/far clipping.
# Only depths within [near, far] are predicted; values outside are clamped.
near: 1.0
far: 2.0
# Scenes with any camera FOV exceeding this (degrees) are skipped entirely.
max_fov: 120.0