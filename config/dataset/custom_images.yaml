defaults:
  - view_sampler: arbitrary

name: custom_images
roots: [datasets/custom_images]

image_shape: [352, 640]
background_color: [0.0, 0.0, 0.0]
cameras_are_circular: false

overfit_to_scene: null

# Name of the per-scene metadata JSON file to load.
# Example scene layout:
#   datasets/custom_images/test/scene_001/
#     000.png
#     001.png
#     cameras.json
# Expected cameras.json format:
# {
#   "scene": "scene_001",
#   "frames": [
#     {
#       "image": "000.png",
#       "intrinsics": [[fx, 0, cx], [0, fy, cy], [0, 0, 1]],
#       "extrinsics": [[r11, r12, r13, tx], [r21, r22, r23, ty], [r31, r32, r33, tz], [0, 0, 0, 1]]
#     }
#   ]
# }
# intrinsics_are_normalized=false means fx, fy, cx, cy are in pixel units.
# extrinsics_are_c2w=true means extrinsics are OpenCV-style camera-to-world.
metadata_file: cameras.json
intrinsics_are_normalized: false
extrinsics_are_c2w: true

augment: false
train_times_per_scene: 1
test_times_per_scene: 1
shuffle_val: false
skip_bad_shape: true

near: 0.5
far: 100.0
max_fov: 120.0