# @package _global_

# Experiment for the realm / custom_images datasets.
#
# Same model architecture block as experiment/re10k.yaml, because the pretrained
# depth and Gaussian-splatting checkpoints require it. Unlike re10k it sets NO
# dataset values: image_shape, near and far come from
# config/dataset/custom_images.yaml and apply to the whole scene. Do not pass
# dataset.near / dataset.far on the command line; change the yaml instead.
#
# Usage: python -m src.main +experiment=realm dataset/view_sampler=realm mode=test ...

defaults:
  - override /dataset: custom_images
  - override /model/encoder: depthsplat
  - override /loss: [mse, lpips]

wandb:
  name: realm
  tags: [realm, custom_images]

model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]

# lpips loss
loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

# Required by the typed config (main.yaml does not define it); value as in re10k.
trainer:
  num_nodes: 1
