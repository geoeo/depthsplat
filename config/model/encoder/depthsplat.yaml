name: depthsplat

num_depth_candidates: 128
num_surfaces: 1

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 1e-10
  gaussian_scale_max: 3.
  sh_degree: 2

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

unimatch_weights_path: "pretrained/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1,1,1]
costvolume_unet_attn_res: []
depth_unet_feat_dim: 64
depth_unet_attn_res: []
depth_unet_channel_mult: [1, 1, 1]
downscale_factor: 4
shim_patch_size: 4

local_mv_match: 2

# monodepth
monodepth_vit_type: vits

# return depth
supervise_intermediate_depth: true
return_depth: true

# mv_unimatch
num_scales: 1
upsample_factor: 4
lowest_feature_resolution: 4
depth_unet_channels: 128
grid_sample_disable_cudnn: false

# depthsplat color branch
large_gaussian_head: false
color_large_unet: false
init_sh_input_img: true
feature_upsampler_channels: 64
gaussian_regressor_channels: 64

# only depth
train_depth_only: false

# Test-time scene-scale normalisation (metric in, metric out): multiply the context
# camera positions and near/far by a factor, run the network, scale depths and
# Gaussians back. Needed for the GS checkpoints (trained at room scale) on metric
# aerial scenes; keep false for the depth-only checkpoints (fine-tuned on metric data).
# scene_scale_mode nearfar (default): sqrt(near*far) of the dataset config maps to
#   scene_scale_target_depth units, i.e. one factor per dataset, independent of the
#   keyframe spacing (custom_images.yaml 10/500 -> factor 0.042; 100 m -> 4.2 units).
# scene_scale_mode baseline: mean consecutive context baseline -> scene_scale_baseline.
#   Collapses to the far plane on slow segments (small baselines); kept for A/B tests.
normalize_scene_scale: false
scene_scale_mode: nearfar
scene_scale_target_depth: 3.0
scene_scale_baseline: 1.0
